name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [ master ]
  schedule:
    - cron: '0 1 * * *'

permissions:
  contents: read

jobs:
  # Decides whether the change touches anything but docs. Docs-only pull requests skip the jobs
  # below; CI Success still runs and reports success, so the required check does not stay pending
  changes:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Detect code changes
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Only pull requests can skip; scheduled and any other runs always test everything
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # HEAD is the PR merge commit, so HEAD^1..HEAD is what the PR changes in master
          changed="$(git diff --name-only --no-renames HEAD^1 HEAD)"

          # Anything not on the docs list counts as code (an empty diff too)
          code=false
          while IFS= read -r file; do
            case "$file" in
              lib/*|spec/*|test/*|ext/*|bin/*) code=true ;;
              *.md|LICENSE*|MIT-LICENSE|.github/ISSUE_TEMPLATE/*|.github/FUNDING.yml) ;;
              *.png|*.jpg|*.jpeg|*.svg|*.gif) ;;
              *) code=true ;;
            esac
          done <<< "$changed"

          echo "Changed files:"
          echo "$changed"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  tests:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - '4.0'
          - '3.4'
          - '3.3'
          - 'jruby-10.0'
        include:
          - ruby: '4.0'
            coverage: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install package dependencies
        run: "[ -e $APT_DEPS ] || sudo apt-get install -y --no-install-recommends $APT_DEPS"

      - name: Set up Ruby
        uses: ruby/setup-ruby@26e5b7d197ebf60545ee9667bcbace0be11ccaec # v1.334.0
        with:
          ruby-version: ${{matrix.ruby}}
          bundler: 'latest'
          self-hosted: false

      - name: Install latest bundler
        run: |
          gem install bundler --no-document
          gem update --system --no-document
          bundle config set without 'tools benchmarks docs'

      - name: Bundle install
        run: |
          bundle config set without development
          bundle install --jobs 4 --retry 3

      - name: Run all tests
        env:
          GITHUB_COVERAGE: ${{matrix.coverage}}
        run: bundle exec rake test

  rubocop:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    env:
      BUNDLE_GEMFILE: Gemfile.lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Ruby
        uses: ruby/setup-ruby@26e5b7d197ebf60545ee9667bcbace0be11ccaec # v1.334.0
        with:
          ruby-version: '4.0.8'
          bundler-cache: true
      - name: Run rubocop
        run: bundle exec rubocop

  yard-lint:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    env:
      BUNDLE_GEMFILE: Gemfile.lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Ruby
        uses: ruby/setup-ruby@26e5b7d197ebf60545ee9667bcbace0be11ccaec # v1.334.0
        with:
          ruby-version: '4.0.8'
          bundler-cache: true
      - name: Run yard-lint
        run: bundle exec yard-lint lib/

  lostconf:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run lostconf
        run: npx lostconf --fail-on-stale

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    if: always()
    needs:
      - changes
      - rubocop
      - tests
      - yard-lint
      - lostconf
    steps:
      # Skipped jobs are fine only when the change is docs-only
      - name: Check all jobs passed
        if: |
          needs.changes.result != 'success' ||
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled') ||
          (needs.changes.outputs.code != 'false' && contains(needs.*.result, 'skipped'))
        run: exit 1
      - run: echo "All CI checks passed!"
